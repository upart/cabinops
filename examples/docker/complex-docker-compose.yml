services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0
    container_name: mlflow
    depends_on:
      - minio
      - minio-create-bucket
      - postgres
    ports:
      - 5000:5000
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command:
      - sh
      - -c
      - |
        pip install --no-cache-dir psycopg2-binary && \
        mlflow server \
        --host 0.0.0.0 \
        --artifacts-destination s3://${S3_BUCKET_NAME} \
        --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASS}@postgres:5432/${POSTGRES_DB}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:5000/health'')"',
        ]
      interval: 30s
      timeout: 10s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./app/minio:/data
    command: server /data --console-address ":9001"

  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: minio-create-bucket
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        /usr/bin/mc alias set dockerminio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}
        /usr/bin/mc mb --ignore-existing dockerminio/${S3_BUCKET_NAME}

  postgres:
    image: postgres:14.18
    container_name: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./app/postgres:/var/lib/postgresql/data
