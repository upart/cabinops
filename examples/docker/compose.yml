services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.2.0
    container_name: mlflow
    depends_on:
      - minio
      - minio-create-bucket
    ports:
      - 5000:5000
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: mlflow server --host 0.0.0.0 --artifacts-destination s3://${S3_BUCKET_NAME}

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes:
      - ./app/minio:/data
    command: server /data --console-address ":9001"

  minio-create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: minio-create-bucket
    depends_on:
      - minio
    entrypoint: ["sh", "-c"]
    command:
      - |
        sleep 5
        /usr/bin/mc alias set dockerminio http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY}
        /usr/bin/mc mb --ignore-existing dockerminio/${S3_BUCKET_NAME}
